<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>블루베리 게임 · ×12</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    /* ===== Design tokens (스펙 문서 기준) ===== */
    /* Brand — 블루베리 인디고 */
    --berry-900:#241a4d; --berry-600:#4b3fae; --berry-400:#7b6ef0; --berry-100:#ece9fb;
    --bg:#e9f1f7; --muted:#516071;
    --juice:#ff4d7d;                 /* 시그니처 1색 (즙 마젠타) */
    --good:#2fb46b; --warn:#f5a623; --bad:#e5484d;
    /* radius scale */
    --r-sm:6px; --r-md:12px; --r-lg:20px; --r-pill:999px;
    /* motion curves (P1 전면 적용 예정, 토큰만 선정의) */
    --ease-snap:cubic-bezier(.2,.8,.2,1);
    --ease-pop:cubic-bezier(.34,1.56,.64,1);
    --ease-out:cubic-bezier(.16,1,.3,1);
    /* fonts */
    --font-display:"Fredoka","Pretendard",system-ui,sans-serif;
    --font-ui:"Pretendard",system-ui,sans-serif;
    --cell: 48px;

    /* ===== legacy aliases → 새 시스템 (기존 CSS 호환) ===== */
    --bg1:var(--bg); --bg2:#d6e6f0;
    --panel:#ffffff; --panel-edge:#d3e0ea;
    --ink:var(--berry-900);
    --target:var(--berry-600);
    --apple1:var(--berry-400); --apple2:var(--berry-600);
    --leaf:#5bb24a; --leaf2:#3f8f34;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    font-family:var(--font-ui);
    background:radial-gradient(120% 100% at 50% -10%, var(--bg1), var(--bg2));
    color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    min-height:100%; padding:14px 10px 26px; gap:12px; overflow-x:hidden;
    touch-action:manipulation;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  input, textarea{ user-select:text; -webkit-user-select:text; }
  .wrap{width:min(96vw,1000px); display:flex; flex-direction:column; gap:12px;}
  header{
    display:flex; align-items:center; justify-content:space-between; gap:14px 20px; flex-wrap:wrap;
    background:var(--panel); border:3px solid var(--panel-edge); border-radius:var(--r-lg);
    padding:16px 20px; box-shadow:0 8px 22px rgba(40,66,110,.13);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .badge{
    display:flex; align-items:baseline; gap:2px; font-family:var(--font-display);
    background:linear-gradient(160deg,var(--apple1),var(--apple2));
    color:#fff; font-weight:700; padding:8px 16px; border-radius:var(--r-md);
    box-shadow:0 6px 0 #352a7e, 0 10px 18px rgba(75,63,174,.28);
    font-size:26px; letter-spacing:.5px;
  }
  .badge small{font-size:14px; font-weight:500; opacity:.9;}
  .brand .sub{font-size:13px; color:var(--muted); line-height:1.3;}
  .brand .sub b{color:var(--ink); font-weight:600;}
  .stats{display:flex; align-items:center; gap:18px;}
  .stat{display:flex; flex-direction:column; align-items:flex-end; line-height:1;}
  .stat .k{font-size:12px; color:var(--muted); margin-bottom:4px; letter-spacing:.4px;}
  .stat .v{font-size:30px; font-weight:700; font-family:var(--font-display); font-variant-numeric:tabular-nums;}
  .timewrap{flex:1; min-width:160px;}
  .timebar{height:14px; border-radius:var(--r-pill); background:#dfe9f0; overflow:hidden; box-shadow:inset 0 1px 2px rgba(23,44,66,.12);}
  .timefill{height:100%; width:100%; border-radius:var(--r-pill);
    background:linear-gradient(90deg,#7b6ef0,#4b3fae); transition:width .25s linear;}
  .timefill.low{background:linear-gradient(90deg,#ff8a5c,var(--bad));}

  .boardwrap{position:relative; align-self:center;}
  #board{
    position:relative; width:min(96vw,1000px); aspect-ratio:17/10;
    background:var(--panel); border:3px solid var(--panel-edge);
    border-radius:var(--r-lg); box-shadow:0 16px 38px rgba(40,66,110,.18), inset 0 2px 6px rgba(255,255,255,.7);
    display:grid; grid-template-columns:repeat(17,1fr); grid-template-rows:repeat(10,1fr);
    touch-action:none; overflow:hidden; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  .cell{position:relative; display:flex; align-items:center; justify-content:center;}

    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:calc(var(--cell)*0.46);
    text-shadow:0 1px 2px rgba(15,15,60,.92), 0 0 5px rgba(15,15,60,.55);
    position:relative; transition:transform .16s ease, opacity .16s ease, filter .3s ease;
  }
  .apple::before{ display:none; }
  .cell.empty .apple{display:none;}
  .apple.pop{animation:applepop .22s cubic-bezier(.3,1.5,.5,1) forwards;}
  @keyframes applepop{0%{transform:scale(1)}28%{transform:scale(1.34)}100%{transform:scale(0); opacity:0}}
  .cell.hl .apple{transform:scale(.9);}
  .apple.bounty{ z-index:3; border-radius:50%;
    box-shadow:0 0 0 3px var(--juice), 0 0 14px 3px rgba(255,77,125,.6);
    animation:bountypulse 1.15s ease-in-out infinite; }
  @keyframes bountypulse{0%,100%{box-shadow:0 0 0 3px var(--juice), 0 0 10px 2px rgba(255,77,125,.45);}
    50%{box-shadow:0 0 0 4px var(--juice), 0 0 20px 7px rgba(255,77,125,.85);}}
  .apple.bounty::after{ content:'★'; position:absolute;
    top:clamp(-6px, calc(var(--cell)*-0.13), -3px); right:clamp(-6px, calc(var(--cell)*-0.13), -3px);
    width:clamp(10px, calc(var(--cell)*0.4), 18px); height:clamp(10px, calc(var(--cell)*0.4), 18px);
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(6px, calc(var(--cell)*0.26), 12px); color:#fff; background:var(--juice);
    border-radius:50%; box-shadow:0 1px 3px rgba(23,44,66,.4); text-shadow:none; z-index:4; }
  #board.fever{ animation:feverglow .85s ease-in-out infinite; }
  @keyframes feverglow{0%,100%{box-shadow:0 0 0 0 rgba(255,77,125,0), 0 16px 38px rgba(40,66,110,.18);}
    50%{box-shadow:0 0 0 6px rgba(255,77,125,.5), 0 16px 38px rgba(40,66,110,.18);}}
  .float.bounty{ color:var(--juice); font-size:30px; font-weight:800; }
  .badge.flip{animation:flip .4s ease;}
  @keyframes flip{0%{transform:rotateX(0)}45%{transform:rotateX(85deg) scale(1.12)}55%{transform:rotateX(-85deg) scale(1.12)}100%{transform:rotateX(0)}}
  .nextline{font-size:12px; color:var(--muted); margin-top:3px;}
  .nextline b{color:var(--ink); font-weight:600;}
  .rotbar{height:5px; width:150px; background:#dfe9f0; border-radius:var(--r-pill); margin-top:5px; overflow:hidden;}
  .rotfill{height:100%; background:linear-gradient(90deg,#9bd0ff,#5aa9f0); border-radius:6px; transition:width .9s linear;}
  #flash{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:9; opacity:0;}
  #flash.show{animation:flashfade .95s ease-out forwards;}
  @keyframes flashfade{0%{opacity:0}10%{opacity:1}72%{opacity:1}100%{opacity:0}}
  #flash .chip{font-family:var(--font-display); font-weight:700; color:#fff;
    font-size:clamp(46px,9vw,104px); padding:6px 46px; border-radius:var(--r-lg);
    background:var(--apple2); box-shadow:0 16px 44px rgba(23,44,66,.4); transform:scale(.5);}

  .float{position:absolute; z-index:8; pointer-events:none; font-weight:700; color:var(--good);
    text-shadow:0 1px 2px rgba(255,255,255,.8); animation:floatUp .8s ease-out forwards; font-size:22px;}
  @keyframes floatUp{from{transform:translate(-50%,-50%) scale(.6); opacity:0;}
    20%{opacity:1; transform:translate(-50%,-70%) scale(1.1);}
    to{transform:translate(-50%,-150%) scale(1); opacity:0;}}

  .toolbar{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .legend{font-size:13px; color:var(--muted);}

  .btn{font-family:inherit; font-weight:600; font-size:15px; cursor:pointer; border:none;

  .overlay{position:fixed; inset:0; background:rgba(23,44,66,.55); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; z-index:20;}

  .modal{background:var(--panel); border:3px solid var(--panel-edge); border-radius:var(--r-lg);

<body>

<script>
(function(){
  const COLS=17, ROWS=10, ALPHA=[2,3,4,6,8,9], TIME=120, ROT_MIN=7, ROT_MAX=12, CYCLE=[12,18,24];
  const HINTS={12:'2×6, 3×4, 2×2×3', 18:'2×9, 3×6, 2×3×3', 24:'3×8, 4×6, 2×3×4'};
  const WEIGHTS={2:4, 3:7, 4:4, 6:4, 8:4, 9:2};   // 3 자주, 9 드물게
  const BAG=Object.entries(WEIGHTS).flatMap(([v,w])=>Array(w).fill(+v));
  let TARGET=CYCLE[0], cycleIdx=0, curRot=ROT_MAX, rotLeft=ROT_MAX;
  function nextRot(){ return ROT_MIN + Math.floor(Math.random()*(ROT_MAX-ROT_MIN+1)); }
  const board=document.getElementById('board');
  const sel=document.getElementById('sel'), selpill=document.getElementById('selpill');
  const elScore=document.getElementById('score'), elBest=document.getElementById('best'),
        elTime=document.getElementById('time'), elFill=document.getElementById('timefill');
  const overlay=document.getElementById('overlay');
  const rankOverlay=document.getElementById('rankOverlay');
  let grid=[], cells=[], score=0, best=0, timeLeft=TIME, timer=null, started=false, ended=false;
  let totalApples=0;

  // ---- build DOM grid once ----
  for(let r=0;r<ROWS;r++){
    cells[r]=[];
    for(let c=0;c<COLS;c++){
      const cell=document.createElement('div'); cell.className='cell';
      const ap=document.createElement('div'); ap.className='apple';
      cell.appendChild(ap); board.appendChild(cell); cells[r][c]={cell, ap};
    }
  }

  function newBoard(){
    grid=[]; totalApples=ROWS*COLS;
    for(let r=0;r<ROWS;r++){ grid[r]=[];
      for(let c=0;c<COLS;c++){ grid[r][c]=BAG[(Math.random()*BAG.length)|0]; }
    }
    render(); hideStuck(); placeBounty();
  }
  function render(){
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const v=grid[r][c], {cell,ap}=cells[r][c];
      if(v===0){ cell.classList.add('empty'); }
      else{ cell.classList.remove('empty'); ap.textContent=v; ap.classList.remove('pop'); }
    }
    updateDormant();
  }
  function updateDormant(){
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const v=grid[r][c];
      cells[r][c].cell.classList.toggle('dormant', v!==0 && (TARGET % v !== 0));
    }
  }
  function updateBadge(flip){
    document.getElementById('tgt').textContent=TARGET;
    const b=document.getElementById('badge'); const c=TBADGE[TARGET];
    b.style.background='linear-gradient(160deg,'+c[0]+','+c[1]+')';
    b.style.boxShadow='0 6px 0 '+c[2]+', 0 10px 18px rgba(0,0,0,.2)';
    if(flip){ b.classList.remove('flip'); void b.offsetWidth; b.classList.add('flip'); }
  }
  function updateLegend(){ const lt=document.getElementById('legtgt'); lt.textContent=TARGET; lt.style.color=TCOLOR[TARGET]; document.getElementById('legcombo').textContent=HINTS[TARGET]; }
  const TCOLOR={12:'#4b3fae', 18:'#2c54c4', 24:'#6a32c4'};
  const TBADGE={12:['#7b6ef0','#4b3fae','#352a7e'], 18:['#5b86e8','#2c54c4','#1c3a8f'], 24:['#9b6ef0','#6a32c4','#491f8f']};
  function flashTarget(){
    const f=document.getElementById('flash'), chip=f.firstElementChild;
    chip.textContent='× '+TARGET; chip.style.background=TCOLOR[TARGET];
    f.classList.remove('show'); void f.offsetWidth; f.classList.add('show');
    board.style.setProperty('--pulsec', TCOLOR[TARGET]);
    board.classList.remove('pulse'); void board.offsetWidth; board.classList.add('pulse');
  }
  function rotateTarget(){ cycleIdx=(cycleIdx+1)%CYCLE.length; TARGET=CYCLE[cycleIdx]; updateBadge(true); updateLegend(); updateDormant(); refreshStuck(); flashTarget(); }
  function setCellVar(){
    const w=board.clientWidth/COLS;
    document.documentElement.style.setProperty('--cell', w+'px');
    resizeFx();
  }

  // ---- drag selection ----
  let drag=false, sr=0, sc=0, rect=null;
  function ptToCell(e){
    const x=e.clientX-rect.left, y=e.clientY-rect.top;
    const px=rect.width/COLS, py=rect.height/ROWS;
    let c=Math.floor(x/px), r=Math.floor(y/py);
    c=Math.max(0,Math.min(COLS-1,c)); r=Math.max(0,Math.min(ROWS-1,r));
    return [r,c];
  }
  function block(){ return [Math.min(sr,cr),Math.max(sr,cr),Math.min(sc,cc),Math.max(sc,cc)]; }
  let cr=0, cc=0;
  function evalBlock(){
    const [r1,r2,c1,c2]=block(); let prod=1, cnt=0;
    for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++){ const v=grid[r][c]; if(v){prod*=v;cnt++;} }
    return {r1,r2,c1,c2,prod,cnt};
  }
  function drawSel(){
    const px=rect.width/COLS, py=rect.height/ROWS;
    const b=evalBlock();
    sel.style.display='flex';
    sel.style.left=(b.c1*px)+'px'; sel.style.top=(b.r1*py)+'px';
    sel.style.width=((b.c2-b.c1+1)*px)+'px'; sel.style.height=((b.r2-b.r1+1)*py)+'px';
    // highlight
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)cells[r][c].cell.classList.toggle('hl',
        r>=b.r1&&r<=b.r2&&c>=b.c1&&c<=b.c2&&grid[r][c]!==0);
    sel.classList.toggle('good', b.cnt>0 && b.prod===TARGET);
    sel.classList.toggle('over', b.cnt>0 && b.prod>TARGET);
    selpill.textContent = b.cnt===0 ? '' : (b.prod===TARGET? TARGET+' ✓' : b.prod);
    return b;
  }
  function clearHL(){ for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)cells[r][c].cell.classList.remove('hl'); }

  function onDown(e){
    if(ended) return;
    initAudio();
    if(!started){ startTimer(); started=true; }
    rect=board.getBoundingClientRect();
    drag=true; [sr,sc]=ptToCell(e); [cr,cc]=[sr,sc]; drawSel();
    board.setPointerCapture && board.setPointerCapture(e.pointerId);
    e.preventDefault();
  }
  function onMove(e){ if(!drag) return; [cr,cc]=ptToCell(e); drawSel(); e.preventDefault(); }
  function onUp(e){
    if(!drag) return; drag=false;
    const b=drawSel(); sel.style.display='none'; clearHL(); sel.classList.remove('good','over');
    if(b.cnt>0 && b.prod===TARGET) commit(b);
  }
  // ---- juice: audio, particles, combo, shake ----
  let actx=null, muted=false;
  function initAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx&&actx.state==='suspended') actx.resume(); }
  function playPop(combo, big){
    if(muted||!actx) return;
    const t=actx.currentTime, base=520*Math.pow(2, Math.min(combo,12)/12);
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='triangle';
    o.frequency.setValueAtTime(base*1.7,t); o.frequency.exponentialRampToValueAtTime(base,t+0.07);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(big?0.5:0.34,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.18);
    const n=actx.createBufferSource(), buf=actx.createBuffer(1,1024,actx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<1024;i++) d[i]=(Math.random()*2-1)*(1-i/1024);
    n.buffer=buf; const ng=actx.createGain(); ng.gain.setValueAtTime(0.2,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
    n.connect(ng).connect(actx.destination); n.start(t);
  }
  const fx=document.getElementById('fx'), ctx=fx.getContext('2d');
  let parts=[], fxRunning=false; const DPR=Math.min(window.devicePixelRatio||1,2);
  function resizeFx(){ const w=board.clientWidth,h=board.clientHeight; fx.style.width=w+'px'; fx.style.height=h+'px'; fx.width=w*DPR; fx.height=h*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  const PCOLORS=['#7b6ef0','#4b3fae','#a99bf5','#ff4d7d','#ffffff'];
  function burst(cx,cy,n){
    for(let i=0;i<n;i++){ const a=Math.random()*6.283, sp=2+Math.random()*5.5;
      parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2.2,life:1,dec:0.018+Math.random()*0.022,r:2+Math.random()*4,col:PCOLORS[(Math.random()*PCOLORS.length)|0]}); }
    if(!fxRunning){ fxRunning=true; requestAnimationFrame(fxLoop); }
  }
  function fxLoop(){
    ctx.clearRect(0,0,fx.width,fx.height);
    for(let i=parts.length-1;i>=0;i--){ const p=parts[i];
      p.vy+=0.24; p.x+=p.vx; p.y+=p.vy; p.vx*=0.985; p.life-=p.dec;
      if(p.life<=0){ parts.splice(i,1); continue; }
      ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,6.283); ctx.fill();
    }
    ctx.globalAlpha=1;
    if(parts.length) requestAnimationFrame(fxLoop); else { fxRunning=false; ctx.clearRect(0,0,fx.width,fx.height); }
  }
  function shakeBoard(amp){ board.style.setProperty('--amp', amp.toFixed(1)+'px'); board.classList.remove('shake'); void board.offsetWidth; board.classList.add('shake'); }
  function bumpScore(){ elScore.classList.remove('bump'); void elScore.offsetWidth; elScore.classList.add('bump'); }
  let combo=0, comboTimer=null;
  // ---- bounty berry ----
  let bountyR=-1, bountyC=-1, feverUntil=0, feverTimer=null;
  function clearBountyMark(){ if(bountyR>=0 && cells[bountyR] && cells[bountyR][bountyC]) cells[bountyR][bountyC].ap.classList.remove('bounty'); bountyR=-1; bountyC=-1; }
  function placeBounty(){
    clearBountyMark();
    const open=[]; for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(grid[r][c]!==0) open.push([r,c]);
    if(!open.length) return;
    const pick=open[(Math.random()*open.length)|0];
    bountyR=pick[0]; bountyC=pick[1]; cells[bountyR][bountyC].ap.classList.add('bounty');
  }
  function feverActive(){ return performance.now()<feverUntil; }
  function startFever(){ feverUntil=performance.now()+5000; board.classList.add('fever'); clearTimeout(feverTimer); feverTimer=setTimeout(()=>board.classList.remove('fever'),5000); }
  function stopFever(){ feverUntil=0; clearTimeout(feverTimer); board.classList.remove('fever'); }
  function bountyFloat(br,bc,txt){
    const px=board.clientWidth/COLS, py=board.clientHeight/ROWS;
    const f=document.createElement('div'); f.className='float bounty'; f.textContent=txt;
    f.style.left=((bc+0.5)*px)+'px'; f.style.top=((br+0.5)*py)+'px';
    board.parentElement.appendChild(f); setTimeout(()=>f.remove(),900);
  }
  function areaPop(br,bc){
    const px=board.clientWidth/COLS, py=board.clientHeight/ROWS; let extra=0;
    for(let r=br-1;r<=br+1;r++)for(let c=bc-1;c<=bc+1;c++){
      if(r<0||c<0||r>=ROWS||c>=COLS) continue;
      if(grid[r][c]!==0){ grid[r][c]=0; extra++;
        const ap=cells[r][c].ap; ap.classList.remove('pop'); void ap.offsetWidth; ap.classList.add('pop');
        setTimeout(()=>cells[r][c].cell.classList.add('empty'),200);
        burst((c+0.5)*px,(r+0.5)*py, 12);
      }
    }
    if(extra){ let p=extra; if(feverActive()) p*=2; score+=p; elScore.textContent=score; bumpScore(); }
    shakeBoard(7);
  }
  function fireBounty(br,bc){
    const px=board.clientWidth/COLS, py=board.clientHeight/ROWS;
    burst((bc+0.5)*px,(br+0.5)*py, 20);
    const r=Math.random();
    if(r<0.5){ timeLeft+=3; updateTime(); bountyFloat(br,bc,'+3초'); }
    else if(r<0.8){ startFever(); bountyFloat(br,bc,'피버 ×2!'); }
    else { areaPop(br,bc); bountyFloat(br,bc,'광역 팡!'); }
    setTimeout(placeBounty, 450);
  }
  function bumpCombo(){ combo++; clearTimeout(comboTimer); comboTimer=setTimeout(()=>{combo=0;},1500); return combo; }

  function commit(b){
    let gained=0, hitB=false; const px=board.clientWidth/COLS, py=board.clientHeight/ROWS;
    for(let r=b.r1;r<=b.r2;r++)for(let c=b.c1;c<=b.c2;c++){
      if(grid[r][c]!==0){ grid[r][c]=0; gained++;
        if(r===bountyR&&c===bountyC){ hitB=true; cells[r][c].ap.classList.remove('bounty'); }
        const ap=cells[r][c].ap; ap.classList.remove('pop'); void ap.offsetWidth; ap.classList.add('pop');
        setTimeout(()=>cells[r][c].cell.classList.add('empty'),200);
        burst((c+0.5)*px,(r+0.5)*py, 10);
      }
    }
    const cmb=bumpCombo();
    let pts=gained; if(gained>=3) pts+=(gained-2)*2; if(cmb>=2) pts+=cmb;
    if(feverActive()) pts*=2;
    score+=pts; elScore.textContent=score; bumpScore();
    playPop(cmb-1, gained>=3);
    shakeBoard(Math.min(2+gained*0.9+(cmb>2?cmb*0.6:0), 8));
    floatText(b, '+'+pts, gained, cmb);
    if(hitB) fireBounty(bountyR,bountyC);
    setTimeout(()=>{ refreshStuck(); }, 180);
  }
  function floatText(b,txt,gained,cmb){
    const px=board.clientWidth/COLS, py=board.clientHeight/ROWS;
    const f=document.createElement('div'); f.className='float';
    if(gained>=3) f.classList.add('big');
    if(cmb>=2){ f.classList.add('combo'); f.innerHTML=txt+' <span class="cx">×'+cmb+'</span>'; }
    else f.textContent=txt;
    f.style.left=((b.c1+b.c2+1)/2*px)+'px'; f.style.top=((b.r1+b.r2+1)/2*py)+'px';
    board.parentElement.appendChild(f); setTimeout(()=>f.remove(),800);
  }

  // ---- stuck / no-move detection ----
  function hasMove(T){ T=T||TARGET;
    for(let top=0;top<ROWS;top++){
      const col=new Array(COLS).fill(1);
      for(let bot=top;bot<ROWS;bot++){
        for(let c=0;c<COLS;c++) col[c]*= (grid[bot][c]||1);
        for(let l=0;l<COLS;l++){ let p=1;
          for(let r=l;r<COLS;r++){ p*=col[r]; if(p===T) return true; if(p>T) break; }
        }
      }
    }
    return false;
  }
  function hasMoveAny(){ return CYCLE.some(t=>hasMove(t)); }
  const stuck=document.getElementById('stuck');
  function showStuck(){ stuck.classList.add('show'); }
  function hideStuck(){ stuck.classList.remove('show'); }
  function refreshStuck(){ if(!hasMoveAny()) showStuck(); else hideStuck(); }

  // ---- timer ----
  function tick(){
    timeLeft--; rotLeft--;
    if(rotLeft<=0){ rotateTarget(); curRot=nextRot(); rotLeft=curRot; }
    updateTime();
    if(timeLeft<=0) endGame();
  }
  function startTimer(){ if(timer) return; curRot=nextRot(); rotLeft=curRot; timer=setInterval(tick,1000); }
  function pauseTimer(){ if(timer){ clearInterval(timer); timer=null; } }
  function resumeTimer(){ if(!timer && started && !ended) timer=setInterval(tick,1000); }
  function updateTime(){ elTime.textContent=Math.max(0,timeLeft);
    const pct=Math.max(0,timeLeft)/TIME*100; elFill.style.width=Math.min(100,pct)+'%';
    elFill.classList.toggle('low', timeLeft<=20);
  }
  // ---- leaderboard: Google Apps Script + Sheets (GET-based, CORS-safe). Falls back to localStorage if URL not set. ----
  const LB_URL = 'PASTE_YOUR_WEB_APP_URL_HERE';   // ← Apps Script 배포 URL(/exec)을 여기에 붙여넣기
  const REMOTE = LB_URL.indexOf('http') === 0;
  const LB_KEY='blueberry_lb_v1'; let lbMem=[], lbCache=[], lastScore=0, hlName=null, hlScore=0;
  function localLoad(){ try{ return JSON.parse(localStorage.getItem(LB_KEY)||'[]'); }catch(e){ return lbMem; } }
  function localSave(a){ try{ localStorage.setItem(LB_KEY, JSON.stringify(a)); }catch(e){ lbMem=a; } }
  async function lbFetch(){
    if(REMOTE){ try{ const r=await fetch(LB_URL+'?t='+Date.now()); const j=await r.json(); if(Array.isArray(j)) lbCache=j; }catch(e){} }
    else { lbCache=localLoad(); }
    return lbCache;
  }
  async function lbAdd(name,score){
    if(REMOTE){ try{ const r=await fetch(LB_URL+'?action=add&name='+encodeURIComponent(name)+'&score='+score+'&t='+Date.now()); const j=await r.json(); if(Array.isArray(j)) lbCache=j; }catch(e){} }
    else { const a=localLoad(); a.push({name:name,score:score,ts:Date.now()}); if(a.length>2000) a.splice(0,a.length-2000); localSave(a); lbCache=a; } // 전체 기록 보존(표시 단계에서 dedup)
  }
  // 같은 별명은 최고점 1줄만 (원본 데이터는 그대로 저장, 표시 단계에서만 dedup)
  function dedupeBest(arr){
    const best={};
    (arr||[]).forEach(function(e){ if(e==null||e.name==null) return;
      const n=e.name, s=e.score||0, t=e.ts||0, c=best[n];
      if(!c || s>c.score || (s===c.score && t<c.ts)) best[n]={name:n, score:s, ts:t};
    });
    return Object.keys(best).map(function(k){return best[k];})
      .sort(function(a,b){ return (b.score-a.score)||((a.ts||0)-(b.ts||0)); }).slice(0,100);
  }
  function rankOf(sc){ let r=1; for(const e of dedupeBest(lbCache)){ if((e.score||0)>sc) r++; } return r; }
  function renderList(list, hl){
    const view=dedupeBest(lbCache);
    list.innerHTML=''; let mark=true;
    if(!view.length){ const li=document.createElement('li'); li.className='empty'; li.textContent='아직 기록이 없어 — 1등이 되어보자!'; list.appendChild(li); return; }
    view.forEach((e,i)=>{ const li=document.createElement('li');
      if(i<3) li.classList.add('top'+(i+1));
      if(hl && mark && hlName!=null && e.name===hlName){ li.classList.add('me'); mark=false; }
      li.innerHTML='<span class="rk">'+(i+1)+'</span><span class="nm"></span><span class="sc">'+(e.score||0)+'</span>';
      li.querySelector('.nm').textContent=e.name;
      list.appendChild(li);
    });
  }
  function renderBoard(){ renderList(document.getElementById('lbList'), true); }
  async function openRank(){
    pauseTimer();
    const rl=document.getElementById('rankList');
    rl.innerHTML='<li class="empty">불러오는 중…</li>';
    rankOverlay.classList.add('show');
    await lbFetch();
    renderList(rl, false);
  }
  function closeRank(){ rankOverlay.classList.remove('show'); resumeTimer(); }
  async function submitScore(){
    const inp=document.getElementById('nameInput'); const nm=(inp.value||'').trim().slice(0,12);
    if(!nm) return; // 선택 사항: 비워두면 기록 안 함
    document.getElementById('regBtn').disabled=true;
    hlName=nm; hlScore=lastScore;
    // 낙관적 업데이트
    lbCache=lbCache.concat([{name:nm,score:lastScore,ts:Date.now()}]); // 원본 보존, 표시는 dedup
    if(lastScore>best){ best=lastScore; elBest.textContent=best; }
    renderBoard();
    document.getElementById('regBox').classList.add('hide');
    document.getElementById('regDone').classList.add('show');
    await lbAdd(nm,lastScore);
    await lbFetch();
    renderBoard();
  }
  function endGame(){
    clearInterval(timer); timer=null; ended=true; drag=false; sel.style.display='none';
    lastScore=score; hlName=null; stopFever();
    if(score>best){ best=score; elBest.textContent=best; }
    document.getElementById('finalScore').textContent=score;
    let cleared=0; for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(grid[r][c]===0) cleared++;
    document.getElementById('finalPct').textContent=Math.round(cleared/totalApples*100)+'%';
    document.getElementById('finalRank').textContent='이 점수면 '+rankOf(score)+'위';
    const inp=document.getElementById('nameInput'); inp.value=''; document.getElementById('regBtn').disabled=false;
    document.getElementById('regBox').classList.remove('hide');
    document.getElementById('regDone').classList.remove('show');
    renderBoard();
    overlay.classList.add('show');
    setTimeout(()=>{ try{ inp.focus(); }catch(e){} }, 60);
    lbFetch().then(()=>{ if(ended){ document.getElementById('finalRank').textContent='이 점수면 '+rankOf(lastScore)+'위'; renderBoard(); } });
  }
  function restart(){
    if(score>best){ best=score; elBest.textContent=best; }
    clearInterval(timer); timer=null; started=false; ended=false;
    score=0; timeLeft=TIME; elScore.textContent=0; updateTime(); stopFever();
    cycleIdx=0; TARGET=CYCLE[0]; curRot=nextRot(); rotLeft=curRot;
    overlay.classList.remove('show'); newBoard();
    updateBadge(false); updateLegend();
  }
  function reshuffleKeep(){ newBoard(); } // 점수/타이머 유지

  // ---- events ----
  board.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  window.addEventListener('resize', setCellVar);
  document.getElementById('restart').addEventListener('click', restart);
  document.getElementById('again').addEventListener('click', restart);
  document.getElementById('rankBtn').addEventListener('click', openRank);
  document.getElementById('rankClose').addEventListener('click', closeRank);
  rankOverlay.addEventListener('click', (e)=>{ if(e.target===rankOverlay) closeRank(); });
  document.getElementById('reshuffle2').addEventListener('click', ()=>{ reshuffleKeep(); });
  document.getElementById('sndbtn').addEventListener('click', (e)=>{ muted=!muted; if(!muted) initAudio(); e.target.textContent=muted?'🔇':'🔊'; });
  document.getElementById('regBtn').addEventListener('click', submitScore);
  document.getElementById('nameInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitScore(); });
  document.getElementById('lbClear').addEventListener('click', ()=>{
    if(REMOTE){ alert('글로벌 기록은 구글 시트에서 직접 지워주세요.'); return; }
    if(confirm('이 기기의 기록을 모두 지울까요?')){ localSave([]); lbCache=[]; best=0; elBest.textContent=0; renderBoard(); }
  });

  // ---- init ----
  newBoard(); setCellVar(); updateTime(); updateBadge(false); updateLegend();
  if(REMOTE){ document.getElementById('lbClear').style.display='none'; }
  lbFetch().then(()=>{ const v=dedupeBest(lbCache); if(v.length){ best=v[0].score||0; elBest.textContent=best; } });
  window.addEventListener('load', setCellVar);
})();
</script>
